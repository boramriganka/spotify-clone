    <title>Spotify Neo — Music Explorer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #121212;
        color: #FFFFFF;
        overflow: hidden;
      }

      /* Mobile Responsive Fixes */
      @media (max-width: 768px) {
        body {
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
        }
        
        html {
          -webkit-text-size-adjust: 100%;
        }
      }

      /* Custom Webkit Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #5a5a5a;
        border-radius: 6px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #7a7a7a;
      }

      /* Firefox Scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: #5a5a5a transparent;
      }

      /* Range Input Styles - Spotify-like */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
        width: 100%;
        height: 4px;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        background: linear-gradient(to right, #ffffff 0%, #ffffff var(--progress, 0%), #535353 var(--progress, 0%), #535353 100%);
        height: 4px;
        border-radius: 2px;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        background: #ffffff;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
        margin-top: -4px;
        cursor: pointer;
      }

      input[type="range"]::-moz-range-track {
        background: #535353;
        height: 4px;
        border-radius: 2px;
      }

      input[type="range"]::-moz-range-progress {
        background: #ffffff;
        height: 4px;
        border-radius: 2px;
      }

      input[type="range"]::-moz-range-thumb {
        background: #ffffff;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        border: none;
        opacity: 0;
        transition: opacity 0.2s;
        cursor: pointer;
      }

      /* Group hover effect for range inputs */
      .player-controls-group:hover input[type="range"]::-webkit-slider-runnable-track {
        background: linear-gradient(to right, #1ED760 0%, #1ED760 var(--progress, 0%), #535353 var(--progress, 0%), #535353 100%);
      }

      .player-controls-group:hover input[type="range"]::-webkit-slider-thumb {
        opacity: 1;
      }

      .player-controls-group:hover input[type="range"]::-moz-range-progress {
        background: #1ED760;
      }

      .player-controls-group:hover input[type="range"]::-moz-range-thumb {
        opacity: 1;
      }
    </style>
